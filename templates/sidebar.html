{% load static %}
<aside class="sidebar" id="sidebar">
    <div class="brand">
        <div class="mark">B</div>
        <span>Baato</span>
    </div>

    <nav class="nav-group">
        <div class="nav-label">Main</div>
        <button class="nav-item active" data-page="overview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
            <span>Overview</span>
        </button>
        <button class="nav-item" data-page="projects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
            <span>Projects</span>
        </button>
        <button class="nav-item" data-page="team">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="8.5" r="2.5"/><path d="M15.8 14.7c2.5.3 4.3 2 5 5.3"/></svg>
            <span>Team</span>
        </button>
        <button class="nav-item" data-page="billing">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="5" width="19" height="14" rx="2.2"/><path d="M2.5 10h19"/><path d="M6 15h4"/></svg>
            <span>Billing</span>
        </button>
    </nav>

    <nav class="nav-group">
        <div class="nav-label">Manage</div>
        <div class="nav-item-wrap">
            <button class="nav-item nav-parent" data-page="reports" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9m6 10V5m6 14v-7m5-8L4 19"/></svg>
                <span>Reports</span>
                <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>
            </button>
            <div class="nav-submenu" id="submenu-reports">
                <button class="nav-subitem" data-page="reports-balance-sheet" data-url="#">
                    <span>Balance Sheet</span>
                </button>
                <button class="nav-subitem" data-page="reports-trading-account" data-url="#">
                    <span>Trading Account</span>
                </button>
            </div>
        </div>

        <div class="nav-item-wrap">
            <button class="nav-item nav-parent" data-page="settings" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.5-2-3.4-2.3.9a8 8 0 0 0-1.7-1L15 3.6h-4l-.4 2.4a8 8 0 0 0-1.7 1l-2.3-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a8 8 0 0 0 1.7 1l.4 2.4h4l.4-2.4a8 8 0 0 0 1.7-1l2.3.9 2-3.4-2-1.5Z"/></svg>
                <span>Settings</span>
                <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>
            </button>
            <div class="nav-submenu" id="submenu-settings">
                <button class="nav-subitem" data-page="settings-profile" data-url="#">
                    <span>Profile</span>
                </button>
                <button class="nav-subitem" data-page="settings-change-password" data-url="#">
                    <span>Change password</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="profile-area" id="profileArea">
        <button class="mini-profile" id="profileBtn" aria-haspopup="true" aria-expanded="false">
            <div class="avatar">SG</div>
            <div class="who">
                <div class="name">Sunita Gurung</div>
                <div class="role">Project Admin</div>
            </div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="profile-menu" id="profileMenu">
            <button class="profile-menu-item" data-action="profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1-4 3.8-6 7.5-6s6.5 2 7.5 6"/></svg>
                <span>Your profile</span>
            </button>
            <button class="profile-menu-item" data-action="settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.5-2-3.4-2.3.9a8 8 0 0 0-1.7-1L15 3.6h-4l-.4 2.4a8 8 0 0 0-1.7 1l-2.3-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a8 8 0 0 0 1.7 1l.4 2.4h4l.4-2.4a8 8 0 0 0 1.7-1l2.3.9 2-3.4-2-1.5Z"/></svg>
                <span>Account settings</span>
            </button>
            <div class="profile-menu-divider"></div>
            <button class="profile-menu-item danger" data-action="logout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9"/><path d="M10 12h11m0 0-3.5-3.5M21 12l-3.5 3.5"/></svg>
                <span>Log out</span>
            </button>
        </div>
    </div>
</aside>
