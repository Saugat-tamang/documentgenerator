{% extends 'admin/base.html' %}
{% load static %}
{% block content %}
<div class="content-wrapper">
  <div class="row">
    <div class="col-12 grid-margin">
      <div class="card">
        <div class="card-body d-flex justify-content-between align-items-center">
          <h4 class="card-title mb-0">Keyboard Shortcuts</h4>
          <div class="text-muted small">Tip: Press Alt+Shift+/ anywhere</div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <div id="shortcutsPage"></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
(function(){
  function hydrate(){
    if (window.FynShortcuts && typeof window.FynShortcuts.renderTo === 'function') {
      window.FynShortcuts.renderTo('shortcutsPage');
      return;
    }
    setTimeout(hydrate, 120);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    hydrate();
  } else {
    window.addEventListener('DOMContentLoaded', hydrate);
  }
})();
</script>
{% endblock %}
