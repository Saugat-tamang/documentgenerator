{% extends 'admin/base.html' %}
{% load static %}
{% block style %}
{% endblock %}
{% block content %}
<div class="content-wrapper">
    <div class="row">
        <div class="col-12 grid-margin">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mt-2">
                            <strong class="card-title heading-size fs-5">Client Assign</strong>
                        </div>
                        <div class="col-md-6 text-end">
                            <button class="btn custom-btn p-3 dropdown-toggle" type="button" id="reportDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-plus-circle"></i> Insert Client Details
                            </button>
                            <div class="dropdown-menu dropdown-menu-right navbar-dropdown preview-list pb-0" aria-labelledby="reportDropdown">
                                <a class="dropdown-item preview-item py-3" href="{% url 'client.create' %}">
                                    <div class="preview-item-content">
                                        <h6 class="text-wrap preview-subject fw-normal text-dark ms-3">Insert Client
                                        </h6>
                                    </div>
                                </a>
                                <a class="dropdown-item preview-item py-3" href="{% url 'dashboardconfig.list' %}">
                                    <div class="preview-item-content">
                                        <h6 class="text-wrap preview-subject fw-normal text-dark mb-1 ms-3">Available Data
                                        </h6>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12 grid-margin">
            <div class="card">
                <div class="card-body">
                    <form class="form-sample" action="{% url 'updatedashboard' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        {% if error_message %}
                            <div class="alert alert-danger" role="alert">
                                {{ error_message }}
                            </div>
                        {% endif %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <div class="row">
                                        <div class="col-md-4 mt-2">
                                            <label for="customer_id" style="font-size: var(--label-size);">Client Assign:</label>
                                        </div>
                                        <div class="col-md-8">
                                            <select data-placeholder="Assign To" class="form-control mySelect" name="assign_to" id="customer_id">
                                                <option value="">Select User</option>
                                                {% for user in user_data %}
                                                    <option value="{{ user.id }}">{{ user.username }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <div class="row">
                                        <div class="col-md-4 mt-2">
                                            <label for="customer_id" style="font-size: var(--label-size);">Client Name:</label>
                                        </div>
                                        <div class="col-md-8">
                                            <select data-placeholder="Assign To" multiple="multiple" class="form-control mySelect" name="select_client" id="select_client">
                                                <option value="">Select User</option>
                                                {% for client in client %}
                                                    <option value="{{client.id}}" {% if client.id in disabled_client %} disabled data-completed="true" {% endif %}>{{client.name}}
                                                        {% if client.id in disabled_client %}(Assigned){% endif %}
                                                    </option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block script %}
{% endblock %}
