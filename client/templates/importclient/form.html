{% extends 'admin/base.html' %}
{% load static %}
{% block style %}
<link rel="stylesheet" href="{% static 'assets/css/excelimport.css' %}">
{% endblock %}
{% block content %}
<div class="content-wrapper">
    <div class="row">
        <div class="col-12 grid-margin">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mt-2">
                            <strong class="card-title heading-size fs-5">Upload Client Info in Bulk
                            </strong>
                        </div>
                        <div class="col-md-3 text-end">
                            <a href="{% url 'export_client_demo' %}" class="btn custom-btn p-3">
                                <i class="fas fa-download"></i>Excel Data Import Demo
                            </a>
                        </div>
                        <div class="col-md-3 text-end">
                            <a href="{% url 'client.create' %}" class="btn custom-btn p-3">
                                <i class="fas fa-plus-circle"></i>Enter Data Manually
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12 grid-margin">
            <div class="card">
                <div class="card-body">
                    <form class="form-sample" action=" {% url 'clients.import'%}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <div class="row">
                                        <div class="col-md-4 mt-2">
                                            <label for="excelbalance" style="font-size: var(--label-size);">Upload Excel
                                                File:</label>
                                        </div>
                                        <div class="col-md-8">
                                            <div class="drop-zone" id="drop-zone-balance">
                                                <i class="fas fa-cloud-upload-alt drop-zone-icon"></i>
                                                <p>Drag & Drop Excel file or Click to Upload</p>
                                                <input type="file" id="excelbalance" name="excelbalance"
                                                    accept=".xlsx,.xls" required>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary">Import</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block script %}
<script src="{% static 'assets/js/dropzoneglobal.js' %}"></script>
<script>
    $('.form-sample').on('submit', function(e) {
        e.preventDefault();

        const form = this;
        const formData = new FormData(form);

        $.ajax({
            type: 'POST',
            url: '{% url "clients.import" %}',
            data: formData,
            contentType: false,
            processData: false,
            success: function(response) {
                if (response.success) {
                    window.location.href = response.redirect_url;
                } else {
                    toastr.error(response.error || "Import failed.");
                }
            },
            error: function() {
                toastr.error("An unexpected error occurred during validation.");
            }
        });
    });
</script>
{% endblock %}
