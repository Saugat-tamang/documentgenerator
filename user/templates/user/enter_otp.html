<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <div class="flex justify-center items-center min-h-screen p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8">

      <!-- Icon -->
      <div class="flex justify-center mb-6">
        <div class="bg-indigo-100 text-indigo-700 w-20 h-20 flex items-center justify-center rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 1.657-1.343 3-3 3s-3-1.343-3-3 1.343-3 3-3 3 1.343 3 3z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m-3-1a7 7 0 1114 0 7 7 0 01-14 0z" />
          </svg>
        </div>
      </div>

      <!-- Title -->
      <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">OTP Verification</h2>

      <!-- OTP Form -->
      <form method="POST" action="{% url 'user:verify_otp' %}" class="space-y-5">
        {% csrf_token %}
        <input type="hidden" name="email" value="{{ email }}">
        <input type="hidden" name="device_id" value="{{ device_id }}">

        <!-- OTP Input -->
        <div class="relative">
          <label class="block text-gray-700 font-medium mb-2">Enter OTP</label>
          <input type="text" name="otp" maxlength="6" required
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"/>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="verifyBtn"
                class="w-full bg-indigo-700 text-white py-3 rounded-xl font-semibold hover:bg-indigo-800 transition">
          Verify OTP
        </button>

        <!-- Error Message -->
        {% if message %}
          <p class="text-red-600 text-center font-medium">{{ message }}</p>
        {% endif %}
      </form>

      <!-- Info Text -->
      <p class="text-sm text-gray-500 mt-5 text-center">
        Please enter the OTP sent to your Admin.
      </p>

      <!-- Timer -->
      <p id="timer" class="text-center text-lg font-semibold text-indigo-700 mt-3"></p>

    </div>
  </div>

  <script>
    // 5 minutes countdown
    let timeLeft = 5 * 60; // 5 minutes in seconds
    const timerElement = document.getElementById("timer");
    const verifyBtn = document.getElementById("verifyBtn");

    function updateTimer() {
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      timerElement.textContent = `Time left: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerElement.textContent = "OTP expired!";
        verifyBtn.disabled = true;
        verifyBtn.classList.add("bg-gray-400", "cursor-not-allowed");
        verifyBtn.classList.remove("bg-indigo-700", "hover:bg-indigo-800");
      }
      timeLeft--;
    }

    updateTimer();
    const timerInterval = setInterval(updateTimer, 1000);
  </script>

</body>
</html>
