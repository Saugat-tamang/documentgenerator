<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forgot Password</title>
<style>
  * {
    box-sizing: border-box;
  }

  body, html {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f9f9f9; /* lighter soft background */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    background: #f3f3f3; /* very light gray */
    padding: 2.5rem 3rem;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    max-width: 380px;
    width: 100%;
  }

  h2 {
    text-align: center;
    color: #222;
    margin-bottom: 1.6rem;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }

  label {
    font-weight: 600;
    color: #3b3b3b;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 1rem;
  }

  label svg {
    width: 18px;
    height: 18px;
    stroke: #f3f3f3; /* Indigo 600 */
    stroke-width: 2.2;
  }

  input[type="email"] {
    padding: 0.6rem 0.9rem;
    font-size: 1rem;
    border: 1.8px solid #c8c8c8;
    border-radius: 10px;
    outline-offset: 3px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    width: 100%;
    color: #333;
  }

  input[type="email"]:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 10px #7c73f5aa;
  }

  button {
  margin-top: 1.8rem;
  width: auto;           /* Make width fit content */
  padding: 0.8rem 3.5rem; /* Smaller vertical padding, moderate horizontal */
  background-color: #171623;
  border: none;
  color: white;
  font-size: 1.2rem;       /* Slightly smaller font */
  border-radius: 20px;   /* More rounded */
  cursor: pointer;
  transition: background-color 0.3s;
  font-weight: 600;
}
button:hover {
  background-color: #312e7a;
}

  .error-msg {
    margin-top: 1rem;
    color: #dc2626; /* red-600 */
    font-weight: 700;
    text-align: center;
    font-size: 1rem;
  }
</style>
</head>
<body>
  <div class="container" role="main" aria-labelledby="forgotPasswordTitle">
    <h2 id="forgotPasswordTitle">Forgot Password</h2>
    <form method="POST" novalidate>
      {% csrf_token %}
      <label for="email">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" aria-label="Email icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 12H8m0 0l4-4m0 8l-4-4" />
        </svg>
        Email: &#x2B07;
      </label>
      <input type="email" id="email" name="email" placeholder="Enter your email address" required autocomplete="email" />
      <button type="submit">Send OTP</button>
    </form>
    {% if error %}
      <p class="error-msg" role="alert">{{ error }}</p>
    {% endif %}
  </div>
</body>
</html>
