{% extends 'admin/base.html' %}
{% load static %}
{% block style %}
<style>
       .profile-picture-edit img {
        border-radius: 50%;
        width: 200px;
        height: 200px;
        object-fit: cover;
        border: 5px solid #f0f0f0;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        transition: transform 0.3s ease;
    }

    .profile-picture-edit img:hover {
        transform: scale(1.05);
    }
</style>
{% endblock %}

{% block content %}
<div class="content-wrapper">
    <div class="row">
        <div class="col-12 grid-margin">
            <div class="card">
                <div class="card-body">
                    <div class="edit-profile-container">
                        <h5 class="fs-5 mb-5 mt-3">Edit Profile</h5>
                        <form method="POST" action="{% if user %} {% url 'user:userprofile.update' user.id %} {% endif %}"
                            enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6 d-flex flex-column align-items-center justify-content-center text-center">
                                    <div class="col-md-12 text-center">
                                        <div class="profile-picture-edit">
                                            {% if user.profile_image %}
                                                <img src="{{ user.profile_image.url }}" id="current-profile-image" alt="" />
                                            {% else %}
                                                <img src="{% static 'assets/images/faces/profile/profile.jpg' %}" id="current-profile-image" alt="Profile Picture" />
                                            {% endif %}
                                        </div>
                                        <div class="image-actions">
                                            <button type="button" class="btn btn-remove btn-primary mt-3" onclick="removeImage()">
                                                <i class="fas fa-trash me-2"></i> Remove
                                            </button>
                                            <button type="button" class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#exampleModal">
                                                <i class="fas fa-edit me-2 text-light"></i>Edit Profile
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            
                                <div class="col-md-6">
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <div class="row">
                                                <div class="col-md-4 mt-2">
                                                    <label for="username" style="font-size: var(--label-size);">Username:</label>
                                                </div>
                                                <div class="col-md-8">
                                                    <input type="text" id="username" class="form-control" name="username"
                                                        value="{{ user.username }}" required>
                                                    {% if form.username.errors %}
                                                    <div class="text-danger">{{ form.username.errors }}</div>
                                                    {% endif %}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <div class="row">
                                                <div class="col-md-4 mt-2">
                                                    <label for="email" style="font-size: var(--label-size);">Email:</label>
                                                </div>
                                                <div class="col-md-8">
                                                    <input type="email" id="email" class="form-control" name="email"
                                                        value="{{ user.email }}">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <div class="row">
                                                <div class="col-md-4 mt-2">
                                                    <label for="english_fullname" style="font-size: var(--label-size);">English Full Name:</label>
                                                </div>
                                                <div class="col-md-8">
                                                    <input type="text" id="english_fullname" class="form-control" name="english_fullname"
                                                        value="{{ user.english_fullname }}">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <div class="row">
                                                <div class="col-md-4 mt-2">
                                                    <label for="company" style="font-size: var(--label-size);">Company Name:</label>
                                                </div>
                                                <div class="col-md-8">
                                                    <input type="text" id="company" class="form-control" name="company"
                                                        value="{{ user.company.name }}">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary main-page-heading">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-dark" id="exampleModalLabel">Upload Profile</h5>
                <button type="button" class="close fs-4" data-bs-dismiss="modal" aria-label="Close" style="background: none; border: none;">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="file-upload-form" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="userid" value="{{ user.id }}">
                    <div class="form-group">
                        <input type="file" name="file1" class="form-control" accept="image/*" required>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

 <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
        $('#file-upload-form').on('submit', function (e) {
            e.preventDefault();
            var formData = new FormData(this);
            var csrftoken = $("[name=csrfmiddlewaretoken]").val();
            $.ajax({
                headers: {
                    'X-CSRF-TOKEN': csrftoken
                },
                type: 'POST',
                url: "{% url 'user:upload_file' %}",
                data: formData,
                processData: false,
                contentType: false,
                success: function (response) {
                    var filedata = $('#current-profile-image').attr('src', response.file_url);
                    console.log(filedata)
                    $('#exampleModal').modal('hide'); 
                },
                error: function (response) {
                    alert('File upload failed');
                }
            });
        });
    });
    function removeImage() {
        if (confirm("Are you sure you want to remove this image?")) {
            $('#current-profile-image').attr('src', "{% static 'assets/images/faces/profile/profile.jpg' %}");
        }
    }
</script>
{% endblock %}
